[project]
name = "fabrid"
version = "0.1.0"
description = "FABRID-IDS: Federated Alert-Budget Reallocation for Heterogeneous IoT Intrusion Detection"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
    "pyright>=1.1",
]

[project.scripts]
fabrid = "fabrid.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fabrid*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

# pytest.approx's own type stubs are only partially typed; this affects test
# files exclusively and never the production `src/` code they exercise.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownMemberType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
