cic_iot_diad_2024:
  dataset_id: cic-iot-diad-2024
  status: candidate_external_replication
  weight_evidence_level: not_applicable
  client_key: device_mac
  eligibility:
    min_benign_rows: 10000
    min_attack_rows: 1000
    min_attack_validation_rows: 200
    min_eligible_subtypes: 2
    min_rows_per_eligible_subtype: 50
    min_qualifying_clients_for_confirmatory: 10
  excluded_features:
    - device_mac
    - anomaly_label
    - device_identification_label
    - source_row_id
    - source_file
    - split_id
  numeric_parse_success_threshold: 0.999
  raw_data_path: data/raw/CIC_IOT_DIAD_2024 # not present as of protocol freeze; see BLOCKED_EXTERNAL
