# Attack-subtype-disjoint generalization folds.
# Fixed global mapping; do not assign via hash.

folds:
  0: [bashlite_scan, bashlite_tcp, mirai_ack, mirai_udp]
  1: [bashlite_junk, bashlite_udp, mirai_scan]
  2: [bashlite_combo, mirai_syn, mirai_udpplain]

rotations:
  0: { validation_fold: 0, test_folds: [1, 2] }
  1: { validation_fold: 1, test_folds: [0, 2] }
  2: { validation_fold: 2, test_folds: [0, 1] }

# Botnet-family-disjoint transfer, for the seven clients that have both
# Mirai and BASHLITE (excludes Ennio and Samsung, Mirai-absent).
botnet_family_disjoint:
  eligible_client_count: 7
  directions:
    A: { validation_family: bashlite, test_family: mirai }
    B: { validation_family: mirai, test_family: bashlite }
